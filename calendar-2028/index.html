<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Календарь на 2028 год</title>
		<link rel="stylesheet" href="./styles.css">
		<script type="module" src="./calendar.js"></script>
	</head>
	<body>
		<header class="hero">
			<p class="eyebrow">2028</p>
			<h1>Календарь на 2028 год</h1>
			<p class="lead">Все месяцы високосного года на одной адаптивной странице.</p>
		</header>

		<main>
			<section class="facts" aria-label="Краткая информация">
				<div>
					<span class="fact-number">366</span>
					<span class="fact-label">дней</span>
				</div>
				<div>
					<span class="fact-number">29</span>
					<span class="fact-label">дней в феврале</span>
				</div>
				<div>
					<span class="fact-number">Пн</span>
					<span class="fact-label">первый день недели</span>
				</div>
			</section>

			<section id="calendar-grid" class="calendar-grid" aria-label="Месяцы 2028 года"></section>
		</main>
	</body>
</html>
